title: KidsGift.in
description: >-
  Handpicked gift guides for kids — toys, books, and birthday ideas,
  reviewed and linked to where you can buy them.
url: "https://kidsgift.in"
baseurl: ""
lang: en

permalink: /:title/

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Shown in the footer / disclosure box — edit to match your actual program(s)
affiliate_programs: "Amazon Associates"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
